[package]
name = "tls-baseline-runner"
version = "0.1.0"
edition = "2021"

# Baseline for the QUIC-MLS evaluation: vanilla Quinn (QUIC) + default rustls TLS 1.3.
# Uses the SAME workspace-pinned quinn/rustls/rcgen as the QUIC-MLS side so both runners
# are measured on identical transport machinery and only the handshake differs.

[[bin]]
name = "tls-baseline"
path = "src/main.rs"

[dependencies]
quinn            = { workspace = true }
rustls           = { workspace = true }
rcgen            = { workspace = true }
rustls-pemfile   = { workspace = true }
tokio            = { workspace = true }
# Leaf deps not in the workspace table — declared directly, no conflict risk.
anyhow      = "1"
clap        = { version = "4", features = ["derive"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"